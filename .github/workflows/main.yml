
name: Build Vezya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          
unzip -o vezya_android_apk_source.zip -d project
cd project/vezya_android_apk_source
gradle assembleDebug


      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Vezya-APK
          path: project/vezya_android_apk_source/app/build/outputs/apk/debug/app-debug.apk
